name: Airx
description: 'Airx is a brand of Chart Industries that designs and manufactures durable air‑cooled heat exchangers for the natural gas and energy sectors. Established in 1954, the Air‑X‑Changers product line offers a range of custom‑designed cooling solutions, including engine‑driven, electric‑motor‑driven, and hydraulic‑motor‑driven models. The company focuses on delivering reliable, high‑performance equipment for industrial process technologies, serving applications such as bulk CO₂ carbonation, cryogenic transport, and fuel systems.'
